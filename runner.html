<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 80px rgba(255,120,60,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="shared.js"></script>
<script>
'use strict';
/* =========================================================
   NEON DASH — 횡스크롤 점프 러너
   ========================================================= */
initCanvas(900, 500);
const BEST_KEY = 'runner_best', GROUND = 400, PX = 200, SZ = 36, G = 2600, JUMP = 930, JUMP2 = 820;

const sfx = {
  jump() { tone(420, .12, 'square', .07, 1.8); },
  jump2() { tone(620, .14, 'triangle', .1, 1.9); },
  land() { noise(.06, .08, 900); },
  coin(n) { tone(990 + Math.min(n, 12) * 60, .07, 'square', .05); tone(1480 + Math.min(n, 12) * 60, .09, 'square', .04, 0, .05); },
  boost() { arp([392, 523, 659, 784, 1046, 1318], .04, 'sawtooth', .07, .12); },
  smash() { noise(.3, .3, 2500); tone(140, .25, 'square', .15, .4); },
  stomp() { tone(300, .12, 'square', .12, 2.2); noise(.15, .2, 2000); },
  die() { noise(1, .55, 3000); tone(200, .8, 'sawtooth', .2, .15); },
  start() { arp([392, 523, 659, 784], .07, 'square', .08, .18); },
  mile() { arp([784, 1046, 1318], .06, 'triangle', .1); },
};

/* ===================== 상태 ===================== */
let state = 'title', stateT = 0, score = 0, best = loadBest(BEST_KEY), newRecord = false;
let camX = 0, spd = 360, dist = 0, coinN = 0, bonus = 0, boostT = 0, deadT = 0, coinStreak = 0, coinStreakT = 0, nextMile = 500;
let beatClock = 0, beatN = 0, beat = 0, titleJumpT = 1;
let segs = [], obs = [], coins = [], boosts = [], speedLines = [], genX = 0;
let player = null;
const keys = {}; let touch = false;

const bgStars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, GROUND - 120), s: rand(.6, 1.8), tw: rand(0, TAU) }));
const mtn = Array.from({ length: 13 }, (_, i) => i === 12 ? 0 : rand(20, 90)); mtn[12] = mtn[0];
const city = (() => {
  const out = []; let x = 0;
  while (x < 1400) {
    const w = rand(40, 90), h = Math.random() < .15 ? rand(110, 150) : rand(30, 85);
    const win = []; for (let wy = 10; wy < h - 8; wy += 14) for (let wx = 8; wx < w - 8; wx += 12) if (Math.random() < .3) win.push([wx, wy, Math.random()]);
    out.push({ x, w, h, win }); x += w + rand(4, 20);
  }
  return { list: out, len: x };
})();

function newPlayer() { return { y: GROUND, vy: 0, rot: 0, onGround: true, jumps: 0, coyote: 0, buffer: 0, sx: 1, sy: 1, trail: [], dead: false }; }
function resetWorld() { camX = 0; dist = 0; spd = 400; segs = [{ x0: -3000, x1: Infinity }]; obs = []; coins = []; boosts = []; genX = 1000; }
function startGame() {
  resetFX(); resetWorld(); player = newPlayer();
  coinN = 0; bonus = 0; boostT = 0; deadT = 0; score = 0; newRecord = false; nextMile = 500; coinStreak = 0;
  state = 'play'; stateT = 0; paused = false; flash = .4; flashCol = WH; beatClock = 0; beatN = 0;
  popText(W / 2, H * .4, 'GO!', CY, 60, 1);
  sfx.start();
}
resetWorld(); player = newPlayer();

/* ===================== 맵 생성 ===================== */
function coinArc(cx, peak = 90) {
  for (let i = 0; i < 5; i++) coins.push({ x: cx + (i - 2) * 42, y: GROUND - 50 - (2 - Math.abs(i - 2)) * peak / 2 });
}
const PAT = {
  flat(d) {
    const len = rand(260, 420);
    for (let i = 0; i < 5; i++) coins.push({ x: genX + 60 + i * 45, y: GROUND - 40 });
    if (Math.random() < .09 && boostT <= 0) boosts.push({ x: genX + len * .6, y: GROUND - 80 });
    genX += len;
  },
  spike(d) {
    const len = rand(380, 520), n = 1 + (Math.random() < .4 + d * .4 ? 1 : 0) + (Math.random() < d * .6 ? 1 : 0), sx = genX + len * .5;
    obs.push({ type: 'spike', x: sx, n });
    coinArc(sx + n * 16, 80 + n * 15);
    genX += len;
  },
  wall(d) {
    const h = rand(48, 78), x = genX + 220;
    obs.push({ type: 'wall', x, w: 46, h });
    if (d > .2 && Math.random() < .55) {
      obs.push({ type: 'wall', x: x + 46, w: 46, h: h + 55 });
      for (let i = 0; i < 3; i++) coins.push({ x: x + 69 + i * 40, y: GROUND - h - 55 - 60 });
    } else for (let i = 0; i < 3; i++) coins.push({ x: x + 23 + (i - 1) * 36, y: GROUND - h - 50 });
    genX += 520;
  },
  gap(d) {
    const pre = rand(220, 320), w = rand(110, 150 + d * 110);
    segs[segs.length - 1].x1 = genX + pre;
    coinArc(genX + pre + w / 2, 110);
    genX += pre + w;
    segs.push({ x0: genX, x1: Infinity });
    genX += 140;
  },
  saw(d) {
    obs.push({ type: 'saw', x: genX + 260, r: 28, amp: rand(60, 110), ph: rand(0, TAU), cy: GROUND - 32 });
    genX += 520;
  },
  drone(d) {
    const low = Math.random() < .55;
    obs.push({ type: 'drone', x: genX + 460, y: low ? GROUND - 26 : GROUND - 112, vx: 90 + d * 130 });
    if (!low) for (let i = 0; i < 4; i++) coins.push({ x: genX + 300 + i * 40, y: GROUND - 30 });
    genX += 580;
  },
  combo(d) { PAT.spike(d); PAT.gap(d); },
};
function gen() {
  while (genX < camX + W + 700) {
    if (state !== 'play') { genX += 400; continue; }
    const d = clamp(dist / 25000, 0, 1);
    const opts = [['flat', 1.3 - d * .7], ['spike', 2], ['wall', 1.4], ['gap', 1.4 + d], ['saw', .8 + d], ['drone', .7 + d], ['combo', d * 2]];
    let r = Math.random() * opts.reduce((a, o) => a + o[1], 0), pick = 'flat';
    for (const o of opts) if ((r -= o[1]) <= 0) { pick = o[0]; break; }
    PAT[pick](d);
  }
}

/* ===================== 입력 ===================== */
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true; initAudio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'Escape') { if (state !== 'play' || paused) goMenu(); else paused = true; return; }
  const jump = e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter';
  if (state === 'title' && jump) startGame();
  else if (state === 'over' && stateT > 1.6 && jump) startGame();
  else if (state === 'play') {
    if (e.code === 'KeyP') { paused = !paused; return; }
    if (jump && !paused) tryJump();
  }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release();
});
cvs.addEventListener('pointerdown', e => {
  initAudio(); const p = toGame(e);
  if (e.pointerType === 'touch') touch = true;
  if ((state !== 'play' || paused) && hitMenuBtn(p)) { goMenu(); return; }
  if (paused) { paused = false; return; }
  if (state === 'title') startGame();
  else if (state === 'over' && stateT > 1.6) startGame();
  else if (state === 'play') tryJump();
});
addEventListener('pointerup', () => release());

function tryJump() {
  const p = player; if (!p || p.dead) return;
  if (p.onGround || p.coyote > 0) {
    p.vy = -JUMP; p.onGround = false; p.coyote = 0; p.jumps = 1; p.sx = .7; p.sy = 1.35;
    dust(PX, p.y, 8); if (state === 'play') sfx.jump();
  } else if (p.jumps < 2) {
    p.vy = -JUMP2; p.jumps = 2; p.sx = .75; p.sy = 1.3;
    ring(PX, p.y - SZ / 2, 10, 64, .35, CY, 4); sparks(PX, p.y - 4, 10, CY, 80, 260, .35, 2);
    if (state === 'play') sfx.jump2();
  } else p.buffer = .14;
}
function release() { if (player && !player.dead && player.vy < -380) player.vy = -380; }
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    const l = rand(.3, .6);
    P({ type: 'smoke', x: x + rand(-14, 14), y: y - 3, vx: rand(-160, 40), vy: rand(-90, -10), life: l, max: l, size: rand(4, 9), drag: .9 });
  }
}

/* ===================== 업데이트 ===================== */
function groundAt(x0, x1) { return segs.some(s => s.x0 < x1 && s.x1 > x0); }
function updatePlayer(dt) {
  const p = player; if (p.dead) return;
  p.coyote -= dt; p.buffer -= dt;
  if ((keys.ArrowDown || keys.KeyS) && !p.onGround) p.vy = Math.max(p.vy, 1500);
  p.vy += G * dt;
  let ny = p.y + p.vy * dt;
  const wx = camX + PX, hl = SZ / 2 - 5;
  let land = null;
  if (p.vy >= 0) {
    if (groundAt(wx - hl, wx + hl) && p.y <= GROUND + .5 && ny >= GROUND) land = GROUND;
    for (const o of obs) if (o.type === 'wall' && !o.dead && o.x < wx + hl && o.x + o.w > wx - hl) {
      const top = GROUND - o.h;
      if (p.y <= top + .5 && ny >= top) land = land === null ? top : Math.min(land, top);
    }
  }
  const was = p.onGround, impact = p.vy;
  if (land !== null) {
    ny = land; p.vy = 0; p.onGround = true; p.jumps = 0; p.coyote = .1;
    if (!was) {
      p.sx = 1.4; p.sy = .62; dust(PX, land, 10);
      if (impact > 1200) { shake = Math.max(shake, 8); ring(PX, land, 10, 70, .35, CY, 4); }
      if (state === 'play') sfx.land();
    }
    if (p.buffer > 0) { p.buffer = 0; tryJump(); }
  } else p.onGround = false;
  p.y = ny;
  if (!p.onGround) p.rot += (p.jumps === 2 ? 12 : 8.5) * dt;
  else { const tg = Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2); p.rot = lerp(p.rot, tg, Math.min(1, dt * 22)); }
  p.sx = lerp(p.sx, 1, Math.min(1, dt * 12)); p.sy = lerp(p.sy, 1, Math.min(1, dt * 12));
  p.trail.unshift({ y: p.y, rot: p.rot, x: camX + PX }); if (p.trail.length > 8) p.trail.pop();
  if (p.onGround && Math.random() < .35 && dt > 0) P({ type: 'smoke', x: PX - 14, y: p.y - 2, vx: rand(-200, -80), vy: rand(-40, -5), life: .35, max: .35, size: rand(3, 6), drag: .92 });
  if (boostT > 0 && dt > 0) for (let i = 0; i < 2; i++) P({ type: 'ember', x: PX - 18, y: p.y - SZ / 2 + rand(-14, 14), vx: rand(-500, -300), vy: rand(-30, 30), life: .3, max: .3, size: rand(8, 14), c: Math.random() < .5 ? GR : CY, drag: .95 });
  if (state === 'play' && p.y > H + 60) die();
}

function hitObstacle(o, x, y) {
  if (boostT > 0) {
    o.dead = true; burst(x, y, 28, GR, { shake: 10 }); chips(x, y, 30, 30, 12, o.type === 'wall' ? CY : RD, 300);
    bonus += 100; popText(x, y - 30, 'SMASH! +100', GR, 20); sfx.smash(); hitstop = .04;
  } else die();
}
function die() {
  const p = player; if (p.dead) return;
  p.dead = true;
  const cy = Math.min(p.y, H - 10) - SZ / 2;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const l = rand(1, 1.6);
    P({ type: 'chip', x: PX - SZ / 2 + i * 9 + 4, y: cy - SZ / 2 + j * 9 + 4, vx: rand(-200, 420), vy: rand(-700, -150), w: 9, h: 9, rot: rand(0, TAU), vr: rand(-15, 15), c: (i + j) % 2 ? CY : PK, life: l, max: l, g: 1500, drag: .99 });
  }
  burst(PX, cy, 40, CY, { shake: 26 });
  flash = .7; flashCol = RD; hitstop = .14; timeScale = .3; slowT = .9; deadT = 1.7; sfx.die();
}
function collectCoin(c) {
  c.dead = true; coinN++; coinStreak++; coinStreakT = .6;
  sparks(c.x - camX, c.y, 6, YE, 60, 220, .35, 2);
  P({ type: 'flash', x: c.x - camX, y: c.y, life: .08, max: .08, size: 22 });
  sfx.coin(coinStreak);
}

function updateWorld(dt, rdt) {
  const p = player;
  if (state === 'play' && !p.dead) spd = Math.min(980, 400 + dist * .011);
  else if (state === 'title') spd = 380;
  else spd *= Math.pow(.05, rdt);
  const v = spd * (boostT > 0 ? 1.7 : 1);
  camX += v * dt; if (state === 'play' && !p.dead) dist += v * dt;
  boostT -= dt; coinStreakT -= dt; if (coinStreakT <= 0) coinStreak = 0;
  gen();
  const wx = camX + PX;
  for (const o of obs) {
    if (o.type === 'saw') o.cy = GROUND - o.r - 4 - (Math.sin(T * 2.2 + o.ph) * .5 + .5) * o.amp;
    if (o.type === 'drone') o.x -= o.vx * dt;
  }
  // 충돌
  if (state === 'play' && !p.dead) {
    const x0 = wx - SZ / 2 + 5, x1 = wx + SZ / 2 - 5, y0 = p.y - SZ + 5, y1 = p.y - 2;
    for (const o of obs) {
      if (o.dead) continue;
      switch (o.type) {
        case 'spike':
          for (let i = 0; i < o.n; i++) {
            const tx = o.x + i * 32;
            if (x1 > tx + 9 && x0 < tx + 23 && y1 > GROUND - 24) { hitObstacle(o, tx + 16 - camX, GROUND - 16); break; }
          }
          break;
        case 'wall':
          if (x1 > o.x && x0 < o.x + o.w && y1 > GROUND - o.h + 8) hitObstacle(o, o.x + o.w / 2 - camX, GROUND - o.h / 2);
          break;
        case 'saw': {
          const cx = clamp(o.x, x0, x1), cy = clamp(o.cy, y0, y1);
          if (Math.hypot(cx - o.x, cy - o.cy) < o.r - 6) hitObstacle(o, o.x - camX, o.cy);
          break;
        }
        case 'drone':
          if (x1 > o.x - 20 && x0 < o.x + 20 && y1 > o.y - 12 && y0 < o.y + 12) {
            if (p.vy > 0 && p.y - 6 < o.y - 4) {
              o.dead = true; p.vy = -780; p.jumps = 1; p.sx = 1.3; p.sy = .7;
              burst(o.x - camX, o.y, 24, RD, { shake: 8 }); bonus += 200; popText(o.x - camX, o.y - 30, 'STOMP! +200', OR, 20); sfx.stomp(); hitstop = .05;
            } else hitObstacle(o, o.x - camX, o.y);
          }
          break;
      }
      if (p.dead) break;
    }
  }
  // 코인 · 부스터
  if (!p.dead) {
    const pcx = wx, pcy = p.y - SZ / 2, mag = boostT > 0 ? 260 : 110;
    for (const c of coins) {
      const dx = pcx - c.x, dy = pcy - c.y, d = Math.hypot(dx, dy);
      if (d < mag) { c.x += dx / d * 900 * dt; c.y += dy / d * 900 * dt; }
      if (d < 26) collectCoin(c);
    }
    for (const b of boosts) {
      if (Math.hypot(pcx - b.x, pcy - b.y) < 34) {
        b.dead = true; boostT = 3.5; flash = .5; flashCol = GR; shake = 10;
        ring(PX, pcy, 10, 260, .6, GR, 10); ring(PX, pcy, 10, 160, .4, WH, 4);
        popText(W / 2, H * .35, 'BOOST!!', GR, 48); sfx.boost();
      }
    }
  }
  obs = obs.filter(o => !o.dead && (o.x + (o.w || 40) + 60) > camX - 100);
  coins = coins.filter(c => !c.dead && c.x > camX - 60);
  boosts = boosts.filter(b => !b.dead && b.x > camX - 60);
  segs = segs.filter((s, i) => s.x1 > camX - 400 || i === segs.length - 1);
  // 속도선
  if ((boostT > 0 || spd > 650) && Math.random() < (boostT > 0 ? .9 : .3) && dt > 0) speedLines.push({ x: W + 20, y: rand(20, GROUND - 10), len: rand(80, 220), v: rand(1500, 2600) });
  for (const s of speedLines) s.x -= s.v * dt;
  speedLines = speedLines.filter(s => s.x + s.len > -20);
}

function music(rdt) {
  beat = Math.max(0, beat - rdt * 3.5);
  if (state !== 'play' || player.dead) return;
  beatClock += rdt;
  while (beatClock >= .25) {
    beatClock -= .25; const n = beatN++;
    if (n % 4 === 0) { tone(130, .18, 'sine', .32, .3); beat = 1; }
    if (n % 2 === 1) noise(.04, .05, 7000, 'highpass');
    const bass = [55, 55, 65.4, 49][(n >> 3) % 4];
    if (n % 2 === 0) tone(bass * (n % 4 === 2 ? 2 : 1), .2, 'sawtooth', .05);
  }
}

function update(dt, rdt) {
  stateT += rdt;
  if (state === 'title') {
    titleJumpT -= dt;
    if (titleJumpT <= 0 && player.onGround) { titleJumpT = rand(.8, 1.6); tryJump(); if (Math.random() < .5) setTimeout(() => state === 'title' && tryJump(), 280); }
    beat = .5 + .5 * Math.sin(T * 6.28 * 2);
  }
  updatePlayer(dt);
  updateWorld(dt, rdt);
  music(rdt);
  if (state === 'play') {
    score = Math.floor(dist / 10) + coinN * 50 + bonus;
    const m = Math.floor(dist / 10);
    if (m >= nextMile && !player.dead) {
      popText(W / 2, H * .3, `${nextMile}m!`, YE, 40, 1.1); ring(PX, player.y - SZ / 2, 10, 300, .7, YE, 6); sfx.mile();
      nextMile += 500;
    }
    if (deadT > 0) {
      deadT -= rdt;
      if (deadT <= 0) { state = 'over'; stateT = 0; if (score > best) { best = score; newRecord = true; saveBest(BEST_KEY, best); } }
    }
  }
  updateFX(dt, rdt);
}

/* ===================== 렌더 ===================== */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#07021c'); g.addColorStop(.6, '#22093f'); g.addColorStop(1, '#4a0f55');
  ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, GROUND + 30);
  for (const s of bgStars) { ctx.globalAlpha = .4 + .4 * Math.sin(T * 2 + s.tw); ctx.fillStyle = '#c8b8ff'; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  // 태양
  const cx = W * .7, cy = GROUND - 95, r = 105;
  addGlow(PK, cx, cy, 260, .35 + beat * .15);
  ctx.save(); ctx.beginPath(); ctx.rect(cx - r, cy - r, r * 2, r * 1.05);
  const off = (T * 12) % 16;
  for (let k = 0; k < 8; k++) { const y = cy + r * .05 + k * 16 + off, gap = 2 + k * 1.3; if (y < cy + r) ctx.rect(cx - r, y, r * 2, Math.max(0, 16 - gap)); }
  ctx.clip();
  const sg = ctx.createLinearGradient(0, cy - r, 0, cy + r); sg.addColorStop(0, '#ffe45a'); sg.addColorStop(.55, '#ff7a3c'); sg.addColorStop(1, '#ff2f8f');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.restore();
  // 산
  const mo = (camX * .06) % 600;
  ctx.fillStyle = '#1a0736'; ctx.strokeStyle = rgb(PK, .55); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-mo - 10, GROUND);
  for (let t = 0; t < 3; t++) for (let i = 0; i <= 12; i++) ctx.lineTo(-mo + t * 600 + i * 50, GROUND - 60 - mtn[i]);
  ctx.lineTo(W + 10, GROUND); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 도시
  const co = (camX * .25) % city.len;
  for (let t = 0; t < 2; t++) for (const b of city.list) {
    const x = b.x - co + t * city.len; if (x > W || x + b.w < 0) continue;
    ctx.fillStyle = '#10052a'; ctx.fillRect(x, GROUND - b.h, b.w, b.h);
    ctx.fillStyle = rgb(CY, .35 + beat * .25); ctx.fillRect(x, GROUND - b.h, b.w, 2);
    for (const [wx, wy, r0] of b.win) { ctx.fillStyle = `rgba(255,${200 + r0 * 50 | 0},120,${.25 + .35 * (Math.sin(T * 1.5 + r0 * 20) > .6 ? 1 : .4)})`; ctx.fillRect(x + wx, GROUND - b.h + wy, 5, 6); }
  }
}
function drawFloor() {
  ctx.fillStyle = '#0b021f'; ctx.fillRect(-30, GROUND, W + 60, H - GROUND + 30);
  const a = .22 + beat * .35;
  ctx.strokeStyle = rgb(PK, a); ctx.lineWidth = 1.5; ctx.beginPath();
  for (let j = 1; j <= 8; j++) { const y = GROUND + (H - GROUND) * Math.pow(j / 8, 1.8); ctx.moveTo(0, y); ctx.lineTo(W, y); }
  const step = 70, off = camX % step;
  for (let i = -14; i <= 26; i++) {
    const base = i * step - off;
    ctx.moveTo(W / 2 + (base - W / 2) * .55, GROUND); ctx.lineTo(W / 2 + (base - W / 2) * 2, H);
  }
  ctx.stroke();
  // 구멍 + 지면 엣지
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], sx0 = s.x0 - camX, sx1 = s.x1 === Infinity ? W + 40 : s.x1 - camX;
    if (sx1 < -40 || sx0 > W + 40) continue;
    const a0 = Math.max(-10, sx0), a1 = Math.min(W + 10, sx1);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .55 + beat * .3;
    ctx.drawImage(glow(CY), a0, GROUND - 14, a1 - a0, 28);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#bff6ff'; ctx.fillRect(a0, GROUND - 1, a1 - a0, 3);
    const nx = segs[i + 1];
    if (nx) {
      const g0 = sx1, g1 = nx.x0 - camX;
      if (g1 > -10 && g0 < W + 10) {
        ctx.fillStyle = '#020006'; ctx.fillRect(g0, GROUND - 1, g1 - g0, H - GROUND + 10);
        const gg = ctx.createLinearGradient(0, GROUND, 0, H); gg.addColorStop(0, 'rgba(255,40,80,0)'); gg.addColorStop(1, `rgba(255,40,80,${.35 + beat * .2})`);
        ctx.fillStyle = gg; ctx.fillRect(g0, GROUND, g1 - g0, H - GROUND);
        ctx.fillStyle = rgb(RD); ctx.fillRect(g0, GROUND, 3, H - GROUND); ctx.fillRect(g1 - 3, GROUND, 3, H - GROUND);
      }
    }
  }
}
function drawObstacles() {
  for (const o of obs) {
    const x = o.x - camX;
    if (x > W + 80 || x < -120) continue;
    switch (o.type) {
      case 'spike':
        for (let i = 0; i < o.n; i++) {
          const tx = x + i * 32;
          addGlow(PK, tx + 16, GROUND - 14, 26, .45 + beat * .2);
          const g = ctx.createLinearGradient(0, GROUND - 34, 0, GROUND); g.addColorStop(0, '#ff9ad0'); g.addColorStop(1, '#5a0a3a');
          ctx.fillStyle = g; ctx.strokeStyle = rgb(PK); ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(tx, GROUND); ctx.lineTo(tx + 16, GROUND - 34); ctx.lineTo(tx + 32, GROUND); ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        break;
      case 'wall': {
        const top = GROUND - o.h;
        addGlow(CY, x + o.w / 2, top + o.h / 2, o.h * .9, .2);
        const g = ctx.createLinearGradient(x, 0, x + o.w, 0); g.addColorStop(0, '#1a2a5a'); g.addColorStop(1, '#0c1230');
        ctx.fillStyle = g; ctx.fillRect(x, top, o.w, o.h);
        ctx.save(); ctx.beginPath(); ctx.rect(x, top, o.w, 8); ctx.clip();
        ctx.fillStyle = rgb(YE); for (let k = -8; k < o.w; k += 12) { ctx.beginPath(); ctx.moveTo(x + k, top + 8); ctx.lineTo(x + k + 6, top); ctx.lineTo(x + k + 12, top); ctx.lineTo(x + k + 6, top + 8); ctx.fill(); }
        ctx.restore();
        ctx.strokeStyle = rgb(CY); ctx.lineWidth = 2; ctx.strokeRect(x + 1, top + 1, o.w - 2, o.h - 2);
        ctx.strokeStyle = rgb(CY, .3); ctx.beginPath(); for (let yy = top + 20; yy < GROUND; yy += 14) { ctx.moveTo(x + 4, yy); ctx.lineTo(x + o.w - 4, yy); } ctx.stroke();
        break;
      }
      case 'saw': {
        ctx.strokeStyle = rgb(RD, .35); ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x, GROUND - o.r - 4 - o.amp - 10); ctx.stroke(); ctx.setLineDash([]);
        addGlow(RD, x, o.cy, o.r * 2.2, .5);
        ctx.save(); ctx.translate(x, o.cy); ctx.rotate(-T * 12);
        ctx.fillStyle = '#2a0a18'; ctx.strokeStyle = rgb(RD); ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 24; i++) { const a = i * TAU / 24, r = i % 2 ? o.r - 7 : o.r; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = rgb(RD, .6); ctx.beginPath(); ctx.arc(0, 0, o.r * .55, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
        ctx.restore();
        break;
      }
      case 'drone': {
        const y = o.y + Math.sin(T * 6 + o.x) * 3;
        addGlow(OR, x + 22, y, 16 + Math.random() * 6, .8);
        addGlow(RD, x, y, 34, .3);
        ctx.fillStyle = '#1a0a20'; ctx.strokeStyle = rgb(RD); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(x, y, 20, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,200,200,.6)'; ctx.lineWidth = 2;
        const pw = 14 * Math.abs(Math.sin(T * 40));
        ctx.beginPath(); ctx.moveTo(x, y - 11); ctx.lineTo(x, y - 16); ctx.moveTo(x - pw, y - 17); ctx.lineTo(x + pw, y - 17); ctx.stroke();
        const ex = x - 8 + Math.sin(T * 3) * 3;
        addGlow(RD, ex, y, 10, 1); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, y, 2.5, 0, TAU); ctx.fill();
        break;
      }
    }
  }
}
function drawCollectibles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const c of coins) { const x = c.x - camX; if (x < -20 || x > W + 20) continue; drawGlow(YE, x, c.y, 18, .5); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  for (const c of coins) {
    const x = c.x - camX; if (x < -20 || x > W + 20) continue;
    const sx = Math.abs(Math.cos(T * 5 + c.x * .02));
    ctx.fillStyle = '#ffd84a'; ctx.strokeStyle = '#fff6c0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, c.y, 9 * sx + 1, 9, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  for (const b of boosts) {
    const x = b.x - camX, y = b.y + Math.sin(T * 4) * 6;
    addGlow(GR, x, y, 40 + beat * 10, .7);
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = rgb(GR); ctx.lineWidth = 2.5; ctx.rotate(T * 3);
    ctx.setLineDash([10, 6]); ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.rotate(-T * 3);
    txt('»', 1, 0, 22, '#fff', 'center', 900);
    ctx.restore();
  }
}
function drawCube(x, yb, rot, sx, sy, alpha, ghost) {
  ctx.save(); ctx.translate(x, yb); ctx.scale(sx, sy); ctx.translate(0, -SZ / 2); ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  const h = SZ / 2;
  if (ghost) { ctx.fillStyle = boostT > 0 ? '#5affa0' : '#4fd8ff'; ctx.fillRect(-h, -h, SZ, SZ); ctx.restore(); return; }
  const g = ctx.createLinearGradient(-h, -h, h, h); g.addColorStop(0, '#9af4ff'); g.addColorStop(1, '#2a58c8');
  ctx.fillStyle = g; ctx.fillRect(-h, -h, SZ, SZ);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.strokeRect(-h + 1, -h + 1, SZ - 2, SZ - 2);
  ctx.strokeStyle = 'rgba(10,20,60,.5)'; ctx.lineWidth = 2; ctx.strokeRect(-h + 7, -h + 7, SZ - 14, SZ - 14);
  ctx.fillStyle = '#0a1030'; ctx.fillRect(2, -7, 6, 9); ctx.fillRect(11, -7, 6, 9);
  ctx.fillStyle = '#fff'; ctx.fillRect(5, -6, 2, 3); ctx.fillRect(14, -6, 2, 3);
  ctx.restore();
}
function drawPlayer() {
  const p = player; if (p.dead) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 1; i < p.trail.length; i++) {
    const t = p.trail[i], x = PX - (camX + PX - t.x) * 1;
    drawCube(x - i * 2, t.y, t.rot, 1, 1, .18 * (1 - i / p.trail.length), true);
  }
  ctx.globalCompositeOperation = 'source-over';
  addGlow(boostT > 0 ? GR : CY, PX, p.y - SZ / 2, 46 + beat * 8, .55);
  if (boostT > 0) { ctx.save(); ctx.globalAlpha = .6 + Math.sin(T * 30) * .2; ctx.strokeStyle = rgb(GR); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(PX, p.y - SZ / 2, 34 + Math.sin(T * 20) * 3, 0, TAU); ctx.stroke(); ctx.restore(); }
  drawCube(PX, p.y, p.rot, p.sx, p.sy, 1, false);
  // 그림자
  if (!p.onGround && groundAt(camX + PX - 10, camX + PX + 10)) {
    const hgt = clamp((GROUND - p.y) / 300, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${.4 * (1 - hgt)})`; ctx.beginPath(); ctx.ellipse(PX, GROUND + 3, 18 * (1 - hgt * .5), 4, 0, 0, TAU); ctx.fill();
  }
}
function drawSpeedLines() {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of speedLines) {
    const g = ctx.createLinearGradient(s.x, 0, s.x + s.len, 0);
    g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.len, 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawHUD() {
  const showMenu = state !== 'play' || paused, sx = showMenu ? 120 : 20;
  txt('DISTANCE', sx, 18, 10, 'rgba(180,200,255,.7)');
  txt(`${Math.floor(dist / 10)}m`, sx, 42, 24, '#fff', 'left', 900);
  addGlow(YE, sx + 150, 40, 14, .6);
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(sx + 150, 40, 8, 0, TAU); ctx.fill();
  txt(`× ${coinN}`, sx + 164, 41, 16, rgb(YE), 'left', 900);
  txt('SCORE', W - 20, 18, 10, 'rgba(180,200,255,.7)', 'right');
  txt(score.toLocaleString(), W - 20, 40, 20, '#fff', 'right', 900);
  txt(`HI ${Math.max(best, score).toLocaleString()}`, W - 20, 62, 11, rgb(YE), 'right', 700);
  if (boostT > 0) {
    txt('BOOST', W / 2, 20, 12, rgb(GR), 'center', 900);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(W / 2 - 80, 32, 160, 6);
    ctx.fillStyle = rgb(GR); ctx.fillRect(W / 2 - 80, 32, 160 * boostT / 3.5, 6);
  } else {
    const sp = clamp((spd - 400) / 580, 0, 1);
    txt('SPEED', W / 2, 20, 10, 'rgba(255,180,220,.8)', 'center', 700);
    for (let i = 0; i < 10; i++) { ctx.fillStyle = i < Math.ceil(sp * 10) ? rgb(i > 7 ? RD : i > 4 ? OR : PK) : 'rgba(255,255,255,.12)'; ctx.fillRect(W / 2 - 60 + i * 12, 30, 9, 8); }
  }
}
function drawTitle() {
  const t = stateT;
  drawLogo('NEON DASH', W / 2, H * .22, 66, t, '#ffffff', '#ffd25a', '#ff4fa8', '#ff7a3c');
  ctx.globalAlpha = Math.min(1, Math.max(0, t - .7));
  spacing(6); txt('멈추지 말고 달려라', W / 2, H * .22 + 52, 17, '#ffd8e8', 'center', 700, KFONT); spacing(0);
  if (t > 1) {
    ctx.globalAlpha = .55 + .45 * Math.sin(T * 5);
    txt(touch ? '화면을 터치하여 시작' : 'SPACE 키 또는 클릭하여 시작', W / 2, H * .47, 20, '#fff', 'center', 700, KFONT);
    ctx.globalAlpha = Math.min(1, t - 1) * .85;
    txt('점프 : SPACE / ↑ / 클릭 · 공중에서 한 번 더 = 2단 점프 · 길게 누르면 높이', W / 2, H * .55, 13, '#d8c8ff', 'center', 400, KFONT);
    txt('급강하 : ↓ / S  ·  드론은 밟을 수 있음  ·  P 일시정지 · M 소리 · ESC 메뉴', W / 2, H * .55 + 20, 13, '#d8c8ff', 'center', 400, KFONT);
    if (best > 0) txt(`BEST ${best.toLocaleString()}`, W / 2, H * .64, 14, rgb(YE), 'center', 700);
  }
  ctx.globalAlpha = 1;
}
function drawOver() {
  const t = stateT;
  ctx.fillStyle = `rgba(5,0,15,${Math.min(.65, t * .7)})`; ctx.fillRect(0, 0, W, H);
  drawDropWord('GAME OVER', W / 2, H * .26, 58, t);
  if (t > .9) {
    const k = easeOutCubic(Math.min(1, (t - .9) / 1.2));
    ctx.globalAlpha = Math.min(1, (t - .9) * 3);
    txt('SCORE', W / 2, H * .4, 13, '#a8b8e8', 'center');
    txt(Math.floor(score * k).toLocaleString(), W / 2, H * .49, 42, '#fff', 'center', 900);
    txt(`${Math.floor(dist / 10)}m  ·  COIN ${coinN}  ·  BEST ${best.toLocaleString()}`, W / 2, H * .58, 14, rgb(YE), 'center');
    if (newRecord && k >= 1) {
      ctx.save(); ctx.translate(W / 2, H * .67); ctx.scale(1 + Math.sin(T * 8) * .08, 1 + Math.sin(T * 8) * .08); ctx.rotate(-.05);
      ctx.shadowColor = rgb(YE); ctx.shadowBlur = 20; txt('★ NEW RECORD ★', 0, 0, 24, rgb(YE), 'center', 900); ctx.restore();
    }
  }
  if (t > 1.6) { ctx.globalAlpha = .55 + .45 * Math.sin(T * 5); txt(touch ? '터치하여 다시 시작' : 'SPACE 키로 다시 시작', W / 2, H * .78, 18, '#fff', 'center', 700, KFONT); }
  ctx.globalAlpha = 1;
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawSky();
  drawFloor();
  drawSpeedLines();
  drawFXBack();
  drawCollectibles();
  drawObstacles();
  drawPlayer();
  drawFXFront();
  drawTexts();
  ctx.restore();
  drawVignette(); drawFlash();
  if (state === 'title') drawTitle();
  else {
    drawHUD();
    if (state === 'over') drawOver();
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,10,.6)'; ctx.fillRect(0, 0, W, H);
      txt('PAUSED', W / 2, H * .44, 48, '#fff', 'center', 900);
      txt('P 키 또는 터치로 계속  ·  ESC 메뉴', W / 2, H * .55, 16, '#a8b8e8', 'center', 700, KFONT);
    }
  }
  if (state !== 'play' || paused) drawMenuBtn();
  if (muted) txt('MUTE', W - 14, H - 12, 10, 'rgba(255,255,255,.5)', 'right');
}

runLoop(update, render, () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
</script>
